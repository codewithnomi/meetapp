# Trace storage for local monitoring (design.md section 3). One process, files on a Docker volume,
# traces kept 7 days. Alloy forwards the backend's traces here over OTLP (gRPC, port 4317).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

# Tempo 3 sets how long traces are kept per tenant (the 2.x "compactor" block is gone).
overrides:
  defaults:
    compaction:
      block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
