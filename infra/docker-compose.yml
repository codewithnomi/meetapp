# Local services for MeetApp (docs/specs/F00-foundation/design.md section 3, decision D035).
# Start with `pnpm dev`, or: docker compose -f infra/docker-compose.yml --env-file .env up -d --wait
# Rules: every published port is bound to 127.0.0.1 so other devices on the Wi-Fi cannot connect
# (AC-F00-23); data lives in named volumes so it survives restarts (AC-F00-40); every image is
# pinned by version and digest; every setting comes from .env (documented in .env.example).
name: meetapp

services:
  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    # The webhook address depends on API_PORT, which a yaml file can't read: the settings are copied
    # with the address filled in, then the server starts on the copy (F02 design section 7).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__MEETAPP_WEBHOOK_URL__|http://host.docker.internal:$${MEETAPP_API_PORT}/api/v1/livekit/webhook|"
        /etc/livekit.yaml > /tmp/livekit.yaml &&
        exec /livekit-server --config /tmp/livekit.yaml --node-ip 127.0.0.1
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set in .env}: ${LIVEKIT_API_SECRET:?set in .env}"
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_API_KEY:?set in .env}"
      MEETAPP_API_PORT: "${API_PORT:?set in .env}"
    # Docker Desktop (Mac) knows host.docker.internal already; Linux (CI) needs this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:?set in .env}:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7880"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.7-pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    # Errors are logged without the failing values (DETAIL) or the statement, so a log line can't quote
    # stored personal data (security rule S10; security review, F00).
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set in .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    # appendonly: every change is written to disk, so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:?set in .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # S3-compatible file storage. RustFS replaces MinIO, whose free images were withdrawn (D035).
  storage:
    image: rustfs/rustfs:1.0.2@sha256:7e948dad4748bda48f8985fda7195f8cf2e4259427011f6120acc2c9acf51587
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?set in .env}"
      RUSTFS_SECRET_KEY: "${STORAGE_SECRET_KEY:?set in .env}"
      STORAGE_BUCKET: "${STORAGE_BUCKET:?set in .env}"
      STORAGE_REGION: "${STORAGE_REGION:?set in .env}"
    volumes:
      - storagedata:/data
    ports:
      - "127.0.0.1:${STORAGE_PORT:?set in .env}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:?set in .env}:9001"
    # Healthy = the service answers AND the app's bucket exists. The check creates the bucket if
    # it is missing (HTTP 200) and accepts "already exists" (409), so no extra setup step is needed.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://127.0.0.1:9000/health &&
          login="$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY" &&
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT --aws-sigv4 "aws:amz:$$STORAGE_REGION:s3"
          --user "$$login" "http://127.0.0.1:9000/$$STORAGE_BUCKET") &&
          { [ "$$code" = 200 ] || [ "$$code" = 409 ]; }
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:?set in .env}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:?set in .env}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ---------- Monitoring (optional): `pnpm monitoring` (design.md section 3, AC-F00-41 to 44) ----------
  # Status page: checks every service every 30 s and sends "down"/"recovered" alerts.
  gatus:
    image: twinproduction/gatus:v5.37.0@sha256:094eb186e55235db367e90e9d56140e5897b7044c41de23cde4cc18e6da1242e
    profiles: ["monitoring"]
    environment:
      GATUS_CONFIG_PATH: /config/config.yaml
      API_PORT: "${API_PORT:?set in .env}"
      NOTIFIER_PORT: "${NOTIFIER_PORT:?set in .env}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:?set in .env}"
    volumes:
      - ./monitoring/gatus/config.yaml:/config/config.yaml:ro
    ports:
      - "127.0.0.1:${GATUS_PORT:?set in .env}:8080"
    restart: unless-stopped

  # Stores metrics. Alloy pushes them here; Prometheus scrapes nothing itself.
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:?set in .env}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # The one collector: metrics (scrapes + built-in exporters), container logs, and the backend's
  # traces and logs over OTLP. Not privileged; it reads container CPU/memory (cAdvisor) and the Docker
  # disk through read-only host folders. The Docker and containerd sockets it needs still allow full
  # control of Docker: accepted only because this is local and optional (D041).
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    profiles: ["monitoring"]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      API_PORT: "${API_PORT:?set in .env}"
      MONITORING_DB_PASSWORD: "${MONITORING_DB_PASSWORD:?set in .env}"
      POSTGRES_DB: "${POSTGRES_DB:?set in .env}"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /run/containerd:/run/containerd:ro
    ports:
      - "127.0.0.1:${ALLOY_OTLP_PORT:?set in .env}:4318"
      - "127.0.0.1:${ALLOY_UI_PORT:?set in .env}:12345"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    restart: unless-stopped

  # Log storage (internal only: read through Grafana).
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki
    # No health check: the image has no shell or download tool. Grafana and Alloy retry until it is ready.
    restart: unless-stopped

  # Trace storage (internal only: read through Grafana). No health check, for the same reason as Loki.
  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    profiles: ["monitoring"]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    restart: unless-stopped

  # Dashboards and alert rules, set up from files in monitoring/grafana/.
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set in .env}"
      # Only this computer can reach Grafana, so it opens without a login, read-only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Answers only to 127.0.0.1, so a web page can't reach it through a look-alike address (DNS rebinding).
      GF_SERVER_DOMAIN: 127.0.0.1
      GF_SERVER_ENFORCE_DOMAIN: "true"
      GF_SERVER_ROOT_URL: "http://127.0.0.1:${GRAFANA_PORT:?set in .env}/"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/meetapp-overview.json
      # Alert emails go to the fake inbox (Mailpit).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: monitoring@meetapp.local
      GF_SMTP_FROM_NAME: MeetApp monitoring
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      NOTIFIER_PORT: "${NOTIFIER_PORT:?set in .env}"
      ALERT_EMAIL_TO: "${ALERT_EMAIL_TO:?set in .env}"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?set in .env}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 36
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storagedata:
  prometheusdata:
  alloydata:
  lokidata:
  tempodata:
  grafanadata:
